# Replace config file, optionally keeping a backup.
#
# The backup is created by the file module (`backup: true`) which only makes a
# copy WHEN the file actually changes. That adjacent backup is then relocated
# into the central `config_backup_dir` with the historical
# `<app>-<file>-<date>` naming. This keeps unchanged config files green on
# repeat runs while preserving the documented central backup directory.
---
- name: "[Config][{{ app }}] Overwrite {{ target_file }} with template. Overwrite flag is: {{ config_files_overwrite }}"
  ansible.builtin.template:
    src: "{{ source_template }}"
    dest: "{{ target_file }}"
    mode: '0644'
    backup: "{{ config_files_backup | bool }}"
  register: config_from_template
  when: config_files_overwrite | bool and source_template is defined

- name: "[Config][{{ app }}] Overwrite {{ target_file }} with file. Overwrite flag is: {{ config_files_overwrite }}"
  ansible.builtin.copy:
    src: "{{ source_file }}"
    dest: "{{ target_file }}"
    mode: '0644'
    backup: "{{ config_files_backup | bool }}"
  register: config_from_file
  when: config_files_overwrite | bool and source_file is defined

- name: "[Config][{{ app }}] Move {{ target_file }} backup into {{ config_backup_dir }}"
  ansible.builtin.command:
    cmd: >-
      mv {{ config_from_template.backup_file | default(config_from_file.backup_file) }}
      {{ config_backup_dir }}/{{ app }}-{{ target_file | basename }}-{{ lookup('pipe', 'date +%Y-%m-%d-%H-%M-%S') }}
  changed_when: false
  when: config_from_template.backup_file is defined or config_from_file.backup_file is defined

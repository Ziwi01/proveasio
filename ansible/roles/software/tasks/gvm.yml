# Install GVM (Go Version Manager)
# Source: https://github.com/moovweb/gvm
---
- name: "[GVM] Install/update GVM"
  ansible.builtin.shell: |
    set -e -o pipefail
    bash < <(curl -s -S -L https://raw.githubusercontent.com/moovweb/gvm/master/binscripts/gvm-installer)
  register: gvm_install
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.gvm"
    executable: /bin/bash

- name: "[GVM] Show GVM install/update info"
  ansible.builtin.debug:
    msg: "{{ gvm_install.stdout | default('No output was passed from GVM install command') }}"

- name: "[Go] Install Go versions"
  ansible.builtin.shell: ". {{ ansible_facts['env']['HOME'] }}/.gvm/scripts/gvm && gvm install {{ goversion }} -B"
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.gvm/environments/{{ goversion }}"
    executable: /bin/bash
  loop: "{{ go_versions }}"
  loop_control:
    loop_var: goversion

- name: "[Go] Read current default Go environment"
  ansible.builtin.slurp:
    path: "{{ ansible_facts['env']['HOME'] }}/.gvm/environments/default"
  register: gvm_default_raw
  failed_when: false

- name: "[Go] Set default to {{ go_default }}"
  ansible.builtin.shell: ". {{ ansible_facts['env']['HOME'] }}/.gvm/scripts/gvm && gvm use {{ go_default }} --default"
  args:
    executable: /bin/bash
  changed_when: true
  when: gvm_default_raw.content is not defined or go_default not in (gvm_default_raw.content | b64decode)

# AWS CLI interface
# Source: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html
---
- name: "[AWS CLI] Download archive"
  ansible.builtin.get_url:
    url: "{{ awscli_url }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/awscliv2.zip"
    mode: '0644'

- name: "[AWS CLI] Create installation directory in {{ ansible_facts['env']['HOME'] }}/.local/opt"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/awscli-install"
    state: directory
    mode: '0755'

- name: "[AWS CLI] Extract binary"
  ansible.builtin.unarchive:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/opt/awscliv2.zip"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/awscli-install"

- name: "[AWS CLI] Install/update"
  ansible.builtin.shell: |
    set -e -o pipefail
    ./aws/install --bin-dir {{ ansible_facts['env']['HOME'] }}/.local/bin --install-dir {{ ansible_facts['env']['HOME'] }}/.local/opt/aws-cli --update
  register: aws_install
  changed_when: aws_install.stdout is not regex('^Found same AWS CLI version:')
  args:
    executable: /bin/bash
    chdir: "{{ ansible_facts['env']['HOME'] }}/.local/opt/awscli-install"

- name: "[AWS CLI] Show install/update info"
  ansible.builtin.debug:
    msg: "{{ aws_install.stdout | default('No output was passed from AWS install command') }}"

- name: "[AWS CLI] Remove AWS cli from pip"
  ansible.builtin.pip:
    name: awscli
    state: absent
    executable: "{{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3"

# AWS CLI v2 installs into `~/.local/opt/aws-cli/v2/<version>` and points a
# `current` symlink at the active version. The bundled installer never removes
# the previous versions, so they accumulate. Keep only the version referenced
# by the `current` symlink. Controlled by the same switches as every other tool:
#   - cleanup_old_versions:         global on/off switch (default: true)
#   - cleanup_old_versions_exclude: add `aws-cli` to keep every version
- name: "[AWS CLI] Cleanup old versions"
  when:
    - cleanup_old_versions | bool
    - "'aws-cli' not in cleanup_old_versions_exclude"
  tags:
    - versions
    - cleanup
  block:
    - name: "[AWS CLI] Check currently active version symlink"
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/aws-cli/v2/current"
      register: awscli_current

    - name: "[AWS CLI] Find installed versions in ~/.local/opt/aws-cli/v2"
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.local/opt/aws-cli/v2"
        file_type: directory
        excludes: current
        recurse: false
      register: awscli_found_versions
      when: awscli_current.stat.exists and awscli_current.stat.islnk

    - name: "[AWS CLI] Remove old versions (keeping {{ awscli_current.stat.lnk_target | default('') | basename }})"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ awscli_found_versions.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - awscli_current.stat.exists
        - awscli_current.stat.islnk
        - (item.path | basename) != 'current'
        - (item.path | basename) != (awscli_current.stat.lnk_target | basename)

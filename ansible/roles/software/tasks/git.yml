# Install specific GIT version
---
# The git-core PPA used to be added with `add-apt-repository ppa:git-core/ppa`,
# which drops a legacy one-line `.list` source (e.g.
# `ppa_git_core_ppa_<release>.list` or `git-core-ubuntu-ppa-<release>.list`)
# without a managed `Signed-By` key. This role now manages the repo via
# `deb822_repository` (`git-core-ppa.sources` + `/etc/apt/keyrings/git-core-ppa.asc`).
# If the old `.list` file is left behind, APT sees the same repo declared twice
# with conflicting `Signed-By` values and refuses to read its sources:
#   E:Conflicting values set for option Signed-By regarding source ... git-core/ppa
# Remove any such legacy `.list` source first so the migration is self-healing.
- name: "[Git] Find legacy git-core PPA .list sources"
  become: true
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    contains: ".*git-core/ppa.*"
  register: git_legacy_ppa_sources

- name: "[Git] Remove legacy git-core PPA .list sources (migrated to deb822)"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ git_legacy_ppa_sources.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "[Git] Add git-core/ppa repository"
  become: true
  ansible.builtin.deb822_repository:
    name: git-core-ppa
    types: deb
    uris: "https://ppa.launchpadcontent.net/git-core/ppa/ubuntu"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF911AB184317630C59970973E363C90F8F1B6217"
    install_python_debian: true
    state: present

- name: "[Git] Install latest Git if requested"
  become: true
  ansible.builtin.apt:
    name: "git"
    state: "{{ git_apt_version }}"
    update_cache: true
  when: git_apt_version == 'latest'

- name: "[Git] Install Git version {{ git_apt_version }}"
  become: true
  ansible.builtin.apt:
    name: "git={{ git_apt_version }}"
    state: present
    update_cache: true
  when: git_apt_version != 'latest'

- name: "[Git] Get installed GIT version"
  ansible.builtin.shell: |
    set -e -o pipefail
    apt info git 2>/dev/null | grep Version | awk '{print $2}'
  register: git_version
  args:
    executable: /bin/bash
  changed_when: false
  tags:
    - versions

- name: "[Git] Save used version"
  vars:
    app: git
    target_version:
      git_apt_version: "{{ git_version.stdout }}"
    yq_query: ".git_apt_version = \"{{ git_version.stdout }}\""
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

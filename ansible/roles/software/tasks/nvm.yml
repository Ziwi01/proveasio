# Install Node Version Manager
# Some tools get installed in node (language servers etc.)
# Source: https://github.com/nvm-sh/nvm
---
- name: "[NVM] Get Github URL for proper version"
  vars:
    app: nvm
    repo: nvm-sh/nvm
    version_query: curl -s https://api.github.com/repos/nvm-sh/nvm/releases/latest | jq .name -r | cut -f2 -d'v'
  ansible.builtin.include_role:
    name: common
    tasks_from: github_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[NVM] Create ~/.local/opt/nvm"
  ansible.builtin.file:
    state: directory
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/nvm"
    mode: "0755"

- name: "[NVM] Install NVM" # noqa no-changed-when
  ansible.builtin.shell: |
    set -e -o pipefail
    export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.local/opt/nvm"
    wget -qO- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ nvm_version }}/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh"
  register: nvm_result
  changed_when: "'already installed' not in nvm_result.stdout and 'skipped, since' not in nvm_result.stdout"

- name: "[NVM] Show NVM install" # noqa no-changed-when
  ansible.builtin.debug:
    var: nvm_result.stdout

- name: "[NVM] Install Node {{ node_version }}"
  ansible.builtin.shell: ". {{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh; nvm install {{ node_version }} --default"
  args:
    executable: /bin/bash
  register: nvm_install_node
  changed_when: "'is already installed' not in (nvm_install_node.stdout + nvm_install_node.stderr)"

- name: "[NVM] Get current default Node alias"
  ansible.builtin.shell: ". {{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh; nvm alias default"
  args:
    executable: /bin/bash
  register: nvm_current_default
  changed_when: false
  failed_when: false

- name: "[NVM] Set default Node to {{ node_version }}"
  ansible.builtin.shell: ". {{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh; nvm alias default {{ node_version }}"
  args:
    executable: /bin/bash
  changed_when: true
  when: node_version not in nvm_current_default.stdout

# NOTE (must-run): `npm install -g` re-links global packages and always reports
# work ("changed N packages") even when they are already current, so this task
# shows `changed` on every run. Accepted as a must-run task: there is no cheap
# idempotent check for "already at latest" without a per-package network lookup.
- name: "[NVM] Install Node default packages"
  ansible.builtin.shell: ". {{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh; npm install -g {{ item }}"
  args:
    executable: /bin/bash
  loop: "{{ npm_default_packages }}"
  register: npm_global_install
  changed_when: "'up to date' not in npm_global_install.stdout"

- name: "[NVM] Save used NVM version"
  vars:
    app: nvm
    target_version:
      github_packages:
        nvm: "{{ nvm_version }}"
    yq_query: '.github_packages.nvm = "{{ nvm_version }}"'
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[NVM] Save used Node version"
  vars:
    app: node
    target_version:
      node_version: "{{ node_version }}"
    yq_query: '.node_version = "{{ node_version }}"'
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

# nvm keeps every installed Node version under
# `~/.local/opt/nvm/versions/node/<version>`. Old versions are never removed
# when a new default is installed, so they accumulate. `node_version` may be an
# alias (e.g. `lts/jod`), so the concrete version to keep is resolved from the
# `default` alias via nvm. Controlled by the same switches as every other tool:
#   - cleanup_old_versions:         global on/off switch (default: true)
#   - cleanup_old_versions_exclude: add `node` to keep every Node version
- name: "[NVM] Cleanup old Node versions"
  when:
    - cleanup_old_versions | bool
    - "'node' not in cleanup_old_versions_exclude"
  tags:
    - versions
    - cleanup
  block:
    - name: "[NVM] Resolve currently active (default) Node version"
      ansible.builtin.shell: |
        set -e -o pipefail
        . {{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh
        nvm version default
      args:
        executable: /bin/bash
      register: nvm_default_version
      changed_when: false

    - name: "[NVM] Find installed Node versions"
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/versions/node"
        file_type: directory
        recurse: false
      register: nvm_found_versions
      when:
        - nvm_default_version.stdout | length > 0
        - nvm_default_version.stdout != 'N/A'

    - name: "[NVM] Remove old Node versions (keeping {{ nvm_default_version.stdout }})"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nvm_found_versions.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - nvm_default_version.stdout | length > 0
        - nvm_default_version.stdout != 'N/A'
        - (item.path | basename) != nvm_default_version.stdout

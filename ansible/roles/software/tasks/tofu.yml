# OpenTofu, installed with tenv (see tenv.yml). A repository's version file or
# required_version picks the version; elsewhere the newest installed one runs.
# Sources:
#   - https://opentofu.org/
#   - https://github.com/opentofu/opentofu
---
- name: "[tofu] Resolve version"
  vars:
    app: tofu
    version_query: gh_curl https://api.github.com/repos/opentofu/opentofu/releases/latest | jq .tag_name -r | cut -f2 -d'v'
  ansible.builtin.include_role:
    name: common
    tasks_from: github_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[tofu] Install {{ tofu_version }} with tenv"
  vars:
    app: tofu
    tenv_tool: tofu
    tenv_dir: OpenTofu
    version: "{{ tofu_version }}"
  ansible.builtin.include_role:
    name: common
    tasks_from: tenv_install.yml
    apply:
      tags:
        - versions
  tags:
    - versions

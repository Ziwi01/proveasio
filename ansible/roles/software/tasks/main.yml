---
# Ensure local bin/opt directories are there
- name: "[Software] Ensure dotted directories are there"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .local/bin
    - .local/opt
    - .config
    - .lsp
  tags:
    - always

# Include override variables
#
# `include_vars` REPLACES whole variables, so an `overrides.yml` that pins a few
# versions under `github_packages:` (or `pip_packages:` / `docker_apt_packages:`)
# would wipe out every other entry, including ones added by newer Proveasio
# versions (e.g. `hunk`, `ccmux`, ...). That breaks lookups like
# `github_packages[app]`. To keep overrides additive, we snapshot the default
# catalogs first and merge the user's pins back on top of them afterwards.
- name: "[Software] Snapshot default version catalogs before overrides"
  ansible.builtin.set_fact:
    _proveasio_default_github_packages: "{{ github_packages }}"
    _proveasio_default_pip_packages: "{{ pip_packages }}"
    _proveasio_default_docker_apt_packages: "{{ docker_apt_packages }}"
  tags:
    - always

- name: "[Software] Include ansible/vars/overrides.yml"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ playbook_dir }}/vars/overrides.yml"
      skip: true
  tags:
    - always

- name: "[Software] Merge overridden version catalogs back onto defaults"
  ansible.builtin.set_fact:
    github_packages: "{{ _proveasio_default_github_packages | combine(github_packages | default({})) }}"
    pip_packages: "{{ _proveasio_default_pip_packages | combine(pip_packages | default({})) }}"
    docker_apt_packages: "{{ _proveasio_default_docker_apt_packages | combine(docker_apt_packages | default({})) }}"
  tags:
    - always

# Bundle names in software_tasks_exclude stand for all their members. The
# expanded list keeps the bundle names, so every `when:` guard below only
# needs the tool name. docker/render-overrides.sh does the same for images.
- name: "[Software] Check and expand tool bundles"
  vars:
    _proveasio_includes: "{{ lookup('ansible.builtin.file', role_path ~ '/tasks/main.yml') | regex_findall('file: ([a-z0-9-]+)\\.yml') }}"
    _proveasio_bundle_members: "{{ software_bundles.values() | flatten }}"
  tags:
    - always
  block:
    - name: "[Software] Check that bundle members are includes and bundle names are not"
      ansible.builtin.assert:
        that:
          - _proveasio_bundle_members | difference(_proveasio_includes) | length == 0
          - software_bundles.keys() | intersect(_proveasio_includes) | length == 0
        fail_msg: >-
          software_bundles is invalid. Unknown members:
          {{ _proveasio_bundle_members | difference(_proveasio_includes) | join(', ') or '-' }}.
          Bundle names that are also include names:
          {{ software_bundles.keys() | intersect(_proveasio_includes) | join(', ') or '-' }}.
        quiet: true

    - name: "[Software] Expand bundle names in software_tasks_exclude"
      ansible.builtin.set_fact:
        software_tasks_exclude: >-
          {{ (software_tasks_exclude
              + (software_bundles | dict2items | selectattr('key', 'in', software_tasks_exclude)
                 | map(attribute='value') | flatten))
             | unique }}

# packages (jq and curl for every version lookup), yq (save_version.yml) and
# zsh (oh-my-zsh, and the .zshrc that sets NVIM_APPNAME and loads nvm, gvm and
# rvm) are required, so their includes have no exclude guard. Both roles are
# checked here, before anything is installed: the config role runs after the
# whole software role, so a check there would fail an hour into the run.
- name: "[Software] Check that no required task is excluded"
  vars:
    _proveasio_required_software: "{{ software_tasks_exclude | intersect(['packages', 'yq', 'zsh']) }}"
    _proveasio_required_config: "{{ config_tasks_exclude | default([]) | intersect(['zsh']) }}"
  ansible.builtin.assert:
    that:
      - _proveasio_required_software | length == 0
      - _proveasio_required_config | length == 0
    fail_msg: >-
      packages, yq and zsh are required and cannot be excluded.
      Remove software_tasks_exclude: {{ _proveasio_required_software | join(', ') or '-' }}
      and config_tasks_exclude: {{ _proveasio_required_config | join(', ') or '-' }}
      from ansible/vars/overrides.yml (docker/overrides.yml in an image build).
      Without the zsh config exclude, the next run replaces ~/.zshrc. The old file
      is kept in config_backup_dir when config_files_backup is true. To keep your
      own shell config, see customization/config-files in the docs
      (docs-web/docs/main/customization/30-config-files.md).
    quiet: true
  tags:
    - always


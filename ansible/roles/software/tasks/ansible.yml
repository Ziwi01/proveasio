# Additional Ansible language tools
---
#
# Ansible Language Server
# Source: https://github.com/ansible/ansible-language-server
#
- name: "[Ansible] Get NPM version string"
  ansible.builtin.shell: |
    set -e -o pipefail
    source {{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/nvm.sh || echo 'nvm.sh cannot be found in this directory'
    nvm list current | grep -E 'v[0-9]*\.[0-9]*\.[0-9]*' -o || echo 'Cannot get current NVM version'
  changed_when: false
  args:
    executable: /bin/bash
  register: npm_version

# NOTE (must-run): `npm install -g` re-links global packages and always reports
# work ("changed N packages") even when already current, so this task shows
# `changed` on every run. Accepted as a must-run task: there is no cheap
# idempotent check for "already at latest" without a network version lookup.
- name: "[Ansible] Install Ansible Language server for current NPM"
  ansible.builtin.shell: |
    set -e -o pipefail
    npm install @ansible/ansible-language-server --location=global
  changed_when: "'up to date' not in als_install.stdout"
  args:
    executable: /bin/bash
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/opt/nvm/versions/node/{{ npm_version.stdout }}/bin:{{ ansible_facts['env']['PATH'] }}"
  register: als_install

#
# ansible-lint
#
- name: "[Ansible] Install Ansible PIP specific version"
  ansible.builtin.pip:
    name: "ansible=={{ ansible_pip_version }}"
    executable: "{{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3"
  register: pip_out
  changed_when: "'Requirement already satisfied' not in pip_out.stdout"
  when: ansible_pip_version != 'latest'

- name: "[Ansible] Install Ansible PIP latest version"
  ansible.builtin.pip:
    name: "ansible"
    executable: "{{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3"
    extra_args: --upgrade
  register: pip_out
  changed_when: "'Requirement already satisfied' not in pip_out.stdout"
  when: ansible_pip_version == 'latest'

# The upgrade can replace the ansible-core this playbook runs from. The running
# controller keeps the old code in memory but builds every module it has not
# used yet from the new files, and those modules fail. Stop and ask for a re-run.
- name: "[Ansible] Stop when the running ansible-core was upgraded"
  vars:
    ansible_core_on_disk: "{{ lookup('ansible.builtin.pipe', ansible_playbook_python ~ \" -c 'import ansible.release as r; print(r.__version__)'\") }}"
  when: ansible_core_on_disk != ansible_version.full
  block:
    - name: "[Ansible] Report the ansible-core upgrade"
      ansible.builtin.debug:
        msg: >-
          ansible-core was upgraded from {{ ansible_version.full }} to {{ ansible_core_on_disk }}
          while this playbook was running. The rest of the run would mix both versions and fail,
          so it ends here. Run the playbook again.

    - name: "[Ansible] End the play after the ansible-core upgrade"
      ansible.builtin.meta: end_play

- name: "[Ansible] Get installed Ansible version from PIP"
  ansible.builtin.shell: |
    set -e -o pipefail
    {{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3 show ansible | grep Version | awk '{print $2}'
  changed_when: false
  args:
    executable: /bin/bash
  register: ansible_version_pip
  tags:
    - versions

- name: "[ansible] Save used version"
  vars:
    app: ansible
    target_version:
      ansible_pip_version: "{{ ansible_version_pip.stdout }}"
    yq_query: ".ansible_pip_version = \"{{ ansible_version_pip.stdout }}\""
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[Ansible] Install ansible-lint PIP specific version"
  ansible.builtin.pip:
    name: "ansible-lint=={{ ansible_lint_pip_version }}"
    executable: "{{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3"
  register: pip_out
  changed_when: "'Requirement already satisfied' not in pip_out.stdout"
  when: ansible_lint_pip_version != 'latest'

- name: "[Ansible] Install ansible-lint PIP latest version"
  ansible.builtin.pip:
    name: "ansible-lint"
    executable: "{{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3"
    extra_args: --upgrade
  register: pip_out
  changed_when: "'Requirement already satisfied' not in pip_out.stdout"
  when: ansible_lint_pip_version == 'latest'

# ansible-lint depends on ansible-core, so its upgrade can replace it too. See above.
- name: "[Ansible] Stop when ansible-lint upgraded the running ansible-core"
  vars:
    ansible_core_on_disk: "{{ lookup('ansible.builtin.pipe', ansible_playbook_python ~ \" -c 'import ansible.release as r; print(r.__version__)'\") }}"
  when: ansible_core_on_disk != ansible_version.full
  block:
    - name: "[Ansible] Report the ansible-core upgrade by ansible-lint"
      ansible.builtin.debug:
        msg: >-
          ansible-core was upgraded from {{ ansible_version.full }} to {{ ansible_core_on_disk }}
          while this playbook was running. The rest of the run would mix both versions and fail,
          so it ends here. Run the playbook again.

    - name: "[Ansible] End the play after the ansible-core upgrade by ansible-lint"
      ansible.builtin.meta: end_play

- name: "[Ansible] Get installed Ansible version from PIP"
  ansible.builtin.shell: "set -e -o pipefail; {{ ansible_facts['env']['HOME'] }}/.pyenv/shims/pip3 show ansible-lint | grep Version | awk '{print $2}'"
  changed_when: false
  args:
    executable: /bin/bash
  register: ansible_lint_version
  tags:
    - versions

- name: "[ansible-lint] Save used version"
  vars:
    app: ansible-lint
    target_version:
      ansible_lint_pip_version: "{{ ansible_lint_version.stdout }}"
    yq_query: ".ansible_lint_pip_version = \"{{ ansible_lint_version.stdout }}\""
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

# Terraform, installed with tenv (see tenv.yml). A repository's version file or
# required_version picks the version; elsewhere the newest installed one runs.
# Sources:
#   - https://www.terraform.io/
#   - https://github.com/hashicorp/terraform
---
- name: "[terraform] Resolve version"
  vars:
    app: terraform
    version_query: gh_curl https://api.github.com/repos/hashicorp/terraform/releases/latest | jq .name -r | cut -f2 -d'v'
  ansible.builtin.include_role:
    name: common
    tasks_from: github_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[terraform] Install {{ terraform_version }} with tenv"
  vars:
    app: terraform
    tenv_tool: tf
    tenv_dir: Terraform
    version: "{{ terraform_version }}"
  ansible.builtin.include_role:
    name: common
    tasks_from: tenv_install.yml
    apply:
      tags:
        - versions
  tags:
    - versions

# Terragrunt, installed with tenv (see tenv.yml). A repository's version file or
# required_version picks the version; elsewhere the newest installed one runs.
# Sources:
#   - https://terragrunt.gruntwork.io/
#   - https://github.com/gruntwork-io/terragrunt
---
- name: "[terragrunt] Resolve version"
  vars:
    app: terragrunt
    version_query: gh_curl https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest | jq .name -r | cut -f2 -d'v'
  ansible.builtin.include_role:
    name: common
    tasks_from: github_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[terragrunt] Install {{ terragrunt_version }} with tenv"
  vars:
    app: terragrunt
    tenv_tool: tg
    tenv_dir: Terragrunt
    version: "{{ terragrunt_version }}"
  ansible.builtin.include_role:
    name: common
    tasks_from: tenv_install.yml
    apply:
      tags:
        - versions
  tags:
    - versions

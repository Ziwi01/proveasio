# Azure CLI interface
# Source: https://learn.microsoft.com/en-us/cli/azure/
---
- name: '[AzureCLI] Add Microsoft signing key'
  ansible.builtin.shell: |
    set -eo pipefail
    curl -sLS https://packages.microsoft.com/keys/microsoft.asc |
        gpg --dearmor |
        sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null
    sudo chmod go+r /etc/apt/keyrings/microsoft.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/microsoft.gpg

- name: '[AzureCLI] Add repository into sources list'
  become: true
  ansible.builtin.deb822_repository:
    name: azurecli
    types: deb
    uris: "https://packages.microsoft.com/repos/azure-cli/"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/microsoft.gpg
    install_python_debian: true
    state: present

- name: '[AzureCLI] Update apt cache'
  become: true
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
    cache_valid_time: 3600

- name: '[AzureCLI] Ensure Azure CLI package is installed as latest/present'
  become: true
  when: azurecli_apt_version in ['latest', 'present']
  ansible.builtin.apt:
    update_cache: true
    name: "azure-cli"
    state: "{{ azurecli_apt_version }}"

- name: '[AzureCLI] Ensure Azure CLI package is installed in particular version'
  become: true
  when: azurecli_apt_version not in ['latest', 'present', 'absent']
  ansible.builtin.apt:
    update_cache: true
    allow_downgrade: true
    name: "azure-cli={{ azurecli_apt_version }}"

- name: '[AzureCLI] Get installed package version'
  ansible.builtin.shell: |
    set -e -o pipefail
    apt-cache policy azure-cli | grep Installed | awk '{ print $2 }'
  register: azurecli_version
  changed_when: false
  args:
    executable: /bin/bash
  tags:
    - versions

- name: "[AzureCLI] Save used version"
  vars:
    app: azure-cli
    target_version:
      azurecli_apt_version: "{{ azurecli_version.stdout }}"
    yq_query: ".azurecli_apt_version = \"{{ azurecli_version.stdout }}\""
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

# kubelogin - Azure AD (Entra ID) credential plugin for kubectl, needed for AKS.
# Installed here instead of with `az aks install-cli`, which fails behind
# TLS-inspecting proxies whose root CA does not mark basicConstraints critical
# (az's Python >= 3.13 sets VERIFY_X509_STRICT).
# Source: https://github.com/Azure/kubelogin
- name: "[kubelogin] Get Github URL for proper version"
  vars:
    app: kubelogin
    repo: Azure/kubelogin
    version_query: gh_curl https://api.github.com/repos/Azure/kubelogin/releases/latest | jq .tag_name -r | cut -f2 -d'v'
    github_uri: "v{{ kubelogin_version }}/kubelogin-linux-amd64.zip"
  ansible.builtin.include_role:
    name: common
    tasks_from: github_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[kubelogin] Check if kubelogin {{ kubelogin_version }} is installed"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/kubelogin-{{ kubelogin_version }}"
  register: kubelogin_dir

- name: "Installation"
  when: not kubelogin_dir.stat.exists
  block:
    - name: "[kubelogin] Create directory in {{ ansible_facts['env']['HOME'] }}/.local/opt"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/kubelogin-{{ kubelogin_version }}"
        state: directory
        mode: "0755"

    - name: "[kubelogin] Download kubelogin {{ kubelogin_version }}"
      ansible.builtin.get_url:
        url: "{{ kubelogin_url }}"
        dest: "/tmp/kubelogin-{{ kubelogin_version }}.zip"
        mode: "0644"

    - name: "[kubelogin] Unzip archive"
      ansible.builtin.unarchive:
        src: "/tmp/kubelogin-{{ kubelogin_version }}.zip"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/kubelogin-{{ kubelogin_version }}"

    - name: "[kubelogin] Cleanup zip file"
      ansible.builtin.file:
        path: "/tmp/kubelogin-{{ kubelogin_version }}.zip"
        state: absent

- name: "[kubelogin] Link {{ kubelogin_version }} binary to ~/.local/bin/kubelogin"
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/opt/kubelogin-{{ kubelogin_version }}/bin/linux_amd64/kubelogin"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/kubelogin"
    state: link
    force: true

- name: "[kubelogin] Save used version"
  vars:
    app: kubelogin
    target_version:
      github_packages:
        kubelogin: "{{ kubelogin_version }}"
    yq_query: ".github_packages.kubelogin = \"{{ kubelogin_version }}\""
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[kubelogin] Cleanup old versions"
  vars:
    app: kubelogin
    keep: "{{ kubelogin_version }}"
  ansible.builtin.include_role:
    name: common
    tasks_from: cleanup_versions.yml
    apply:
      tags:
        - versions
        - cleanup
  tags:
    - versions
    - cleanup

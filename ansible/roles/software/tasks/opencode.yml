# opencode - AI coding assistant
# Source: https://github.com/anomalyco/opencode
---
# Mirror the official installer's (opencode.ai/install) target selection so that
# pinning a future release (e.g. a v2.x once its binaries are published) fetches
# the correct asset instead of the hard-coded linux-x64 one:
#   arch     x86_64 -> x64, aarch64 -> arm64
#   baseline x64 CPUs without AVX2 need the -baseline build (default one SIGILLs)
#   musl     Alpine / musl libc (Ubuntu is glibc, so normally a no-op)
- name: "[opencode] Resolve release asset for this host"
  ansible.builtin.shell: |
    set -e -o pipefail
    arch="$(uname -m)"
    case "$arch" in
      x86_64|amd64) arch="x64" ;;
      aarch64|arm64) arch="arm64" ;;
      *) echo "[opencode] unsupported architecture: $arch" >&2; exit 1 ;;
    esac
    target="linux-${arch}"
    if [ "$arch" = "x64" ] && ! grep -qwi avx2 /proc/cpuinfo 2>/dev/null; then
      target="${target}-baseline"
    fi
    if [ -f /etc/alpine-release ] || (command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | grep -qi musl); then
      target="${target}-musl"
    fi
    printf 'opencode-%s.tar.gz' "$target"
  args:
    executable: /bin/bash
  register: opencode_asset_cmd
  changed_when: false
  tags:
    - versions

- name: "[opencode] Set release asset name"
  ansible.builtin.set_fact:
    opencode_asset: "{{ opencode_asset_cmd.stdout }}"
  tags:
    - versions

- name: "[opencode] Get Github URL for proper version"
  vars:
    app: opencode
    repo: anomalyco/opencode
    version_query: gh_curl https://api.github.com/repos/anomalyco/opencode/releases/latest | jq .tag_name -r | cut -f2 -d'v'
    github_uri: "v{{ opencode_version }}/{{ opencode_asset }}"
  ansible.builtin.include_role:
    name: common
    tasks_from: github_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[opencode] Check if opencode {{ opencode_version }} is installed"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/opencode-{{ opencode_version }}"
  register: opencode_dir

- name: "Installation"
  when: not opencode_dir.stat.exists
  block:
    - name: "[opencode] Create directory in {{ ansible_facts['env']['HOME'] }}/.local/opt"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/opencode-{{ opencode_version }}"
        state: directory
        mode: "0755"

    - name: "[opencode] Download opencode {{ opencode_version }}"
      ansible.builtin.get_url:
        url: "{{ opencode_url }}"
        dest: "/tmp/opencode-{{ opencode_version }}.tar.gz"
        mode: "0755"

    - name: "[opencode] Untar archive"
      ansible.builtin.unarchive:
        src: "/tmp/opencode-{{ opencode_version }}.tar.gz"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/opencode-{{ opencode_version }}"

    - name: "[opencode] Cleanup tar.gz file"
      ansible.builtin.file:
        path: "/tmp/opencode-{{ opencode_version }}.tar.gz"
        state: absent

- name: "[opencode] Link {{ opencode_version }} binary to ~/.local/bin/opencode"
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/opt/opencode-{{ opencode_version }}/opencode"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/opencode"
    state: link
    force: true

- name: "[opencode] Save used version"
  vars:
    app: opencode
    target_version:
      github_packages:
        opencode: "{{ opencode_version }}"
    yq_query: ".github_packages.opencode = \"{{ opencode_version }}\""
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

- name: "[opencode] Cleanup old versions"
  vars:
    app: opencode
    keep: "{{ opencode_version }}"
  ansible.builtin.include_role:
    name: common
    tasks_from: cleanup_versions.yml
    apply:
      tags:
        - versions
        - cleanup
  tags:
    - versions
    - cleanup

---
# Overwrite below in `ansible/vars/overrides.yml` for your own info
git: # .gitconfig info
  name: Proveasio
  mail: Proveasio@hell.no

# Add this variable to your ansible/vars/overrides.yml if needed
# This is array of tasks to exclude from config role.
# For list of tasks see: config/tasks/main.yml or see README.md
config_tasks_exclude: []

# Path where to save configuration files
config_backup_dir: "{{ ansible_facts['env']['HOME'] }}/.configs_backup"

# Switch all config overwrites on/off
config_files_overwrite: true

# Backup config files on every
config_files_backup: true

# Default for PROVEASIO_NERD_FONTS, written to ~/.zshrc. Set to false when the
# terminal has no Nerd Font: p10k, tmux, lazygit, eza and the Neovim config
# then use plain glyphs. PROVEASIO_NERD_FONTS set in the environment wins
# (for example `docker run -e PROVEASIO_NERD_FONTS=0`).
nerd_fonts: true

# Neovim config
neovim_config_url: https://github.com/Ziwi01/astronvim.git
neovim_config_version: main
neovim_config_appname: astronvim
neovim_config_path: "{{ ansible_facts['env']['HOME'] }}/.config/{{ neovim_config_appname }}"
# Where the Neovim config comes from:
#   git   - clone neovim_config_url at neovim_config_version (default)
#   local - copy the directory neovim_config_local_path into neovim_config_path
neovim_config_source: git
neovim_config_local_path: ""

# Shared OpenCode config
opencode_config_url: https://github.com/Ziwi01/opencode-config.git
opencode_config_version: main
opencode_config_path: "{{ ansible_facts['env']['HOME'] }}/.local/share/opencode-config"
# Where the OpenCode config comes from:
#   git   - clone opencode_config_url at opencode_config_version (default)
#   local - run install.sh from the directory opencode_config_local_path, no copy
opencode_config_source: git
opencode_config_local_path: ""

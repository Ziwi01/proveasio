# Various
set -g set-titles on
set -g set-titles-string '#(whoami)::#h'
set -g mouse on
set -sg history-file ~/.tmux_history
set -g default-terminal "tmux-256color"
set -g extended-keys on

# Name auto-numbered sessions "Default", then "Default-1", "-2", ... Named
# sessions (tmux new -s <name>, tmuxp, ...) are left untouched.
set-hook -g session-created 'run-shell -b "~/.local/bin/tmux-default-session-name \"#{session_name}\""'

# set vi-mode selection
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Prevent TMUX refresh on selection
bind -T copy-mode    C-w               send-keys -X copy-selection
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode    M-w               send-keys -X copy-selection
bind -T copy-mode-vi C-j               send-keys -X copy-selection
bind -T copy-mode-vi Enter             send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'M-Left' if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind-key -n 'M-Down' if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind-key -n 'M-Up' if-shell "$is_vim" 'send-keys M-Up'  'select-pane -U'
bind-key -n 'M-Right' if-shell "$is_vim" 'send-keys M-Right'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-Left' select-pane -L
bind-key -T copy-mode-vi 'M-Down' select-pane -D
bind-key -T copy-mode-vi 'M-Up' select-pane -U
bind-key -T copy-mode-vi 'M-Right' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# /Smart pane switching

# Status theme
set-option -g renumber-windows on
set-option -g history-limit 50000
set-option -g allow-rename off
set-option -g status-fg white
set-option -g status-bg default
set-option -g status-justify centre
set-option -g status-left-length 25
set-option -g status-left '#[fg=green,bg=default][ #[fg=white] #S #[fg=green,bg=default] ]#[default]'
set-option -g status-right-length 20
set-option -g status-right '#[fg=green]][ #[fg=white,bright]%m/%d %H:%M #[fg=green,nobright]]#[fg=default]'
set-window-option -g window-status-current-format '#[fg=red,bg=default]( #[fg=white,bright,bg=default]#I:#W#[fg=red,nobright,bg=default] )#[fg=default]'
setw -g monitor-activity on
setw -g window-status-activity-style fg=yellow,bg=blue,bold

# Neovim
set-option -sg escape-time 10
set-option -g focus-events on
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Support NVIM sessions restore
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux/resurrect'     # Store TMUX sessions from above

# Transparent statusline background
set-option -g status-style bg=default

# Open new panes in the same directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Neovim on the left of the current pane (mirror of Neovim's <Leader>ON, which opens OpenCode on the right):
# e in the current pane's directory, E in the session's root. Either key closes the window's editor pane
# when it is open; ':confirm qa' asks before discarding unsaved changes. run -C because send-keys does not
# expand formats in -t. E replaces tmux's default (select-layout -E), which moves to + below.
bind e if -F '#{P:#{?#{==:#{pane_id},#{@proveasio_editor}},1,}}' {
  run -C "send-keys -t '#{@proveasio_editor}' Escape ':confirm qa' Enter"
} {
  split-window -hb -l 60% -c '#{pane_current_path}' nvim
  set -wF @proveasio_editor '#{pane_id}'
}
bind E if -F '#{P:#{?#{==:#{pane_id},#{@proveasio_editor}},1,}}' {
  run -C "send-keys -t '#{@proveasio_editor}' Escape ':confirm qa' Enter"
} {
  split-window -hb -l 60% -c '#{session_path}' nvim
  set -wF @proveasio_editor '#{pane_id}'
}
# tmux's default for E, moved because E opens the editor in the session root
bind + select-layout -E

# hunk (diff review, https://github.com/modem-dev/hunk) in a popup over 90% of the screen, see
# ~/.local/bin/hunk-popup. Each tmux session gets one hunk window, started with `hunk diff --watch`
# in the current pane's directory and kept in a hidden session named hunk-<session>.
# Alt+h or <prefix> H shows it and hides it again; hunk and its notes stay alive while hidden.
# Alt+Shift+h (or q in hunk) quits it, which discards the notes.
bind-key -n M-h if -F '#{m:hunk-*,#{session_name}}' detach-client {
  run-shell -b '~/.local/bin/hunk-popup toggle "#{session_name}" "#{pane_current_path}" "#{client_name}"'
}
bind-key H if -F '#{m:hunk-*,#{session_name}}' detach-client {
  run-shell -b '~/.local/bin/hunk-popup toggle "#{session_name}" "#{pane_current_path}" "#{client_name}"'
}
bind-key -n M-H run-shell -b '~/.local/bin/hunk-popup close "#{session_name}" >/dev/null'
# Do not save the hidden hunk sessions with tmux-resurrect.
set -g @resurrect-hook-post-save-layout '~/.local/bin/hunk-popup strip-resurrect'

# TMUX Fuzzback
set -g @fuzzback-bind C-f
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '80%'

# ccmux - Run and track AI coding agents in tmux (https://github.com/epilande/ccmux)
# Picker: jump to the agent that needs you. Sidebar: always-visible agent status rail.
# Prefix + C-p  -> open ccmux picker in a centered popup (closes on select)
bind-key C-p display-popup -E -w 80% -h 75% "ccmux"
# Alt+p (no prefix) -> open ccmux picker from any pane
bind-key -n M-p display-popup -E -w 80% -h 75% "ccmux"
# Prefix + C-o  -> toggle the ccmux sidebar in every tmux window
bind-key C-o run-shell "ccmux sidebar --toggle"
# Alt+o (no prefix) -> toggle the ccmux sidebar from any pane
bind-key -n M-o run-shell "ccmux sidebar --toggle"
# Prefix + C-i  -> open ccmux picker in persistent dashboard mode (stays open after switching)
bind-key C-i display-popup -E -w 85% -h 80% "ccmux picker --persistent"
# Start the ccmux daemon with the tmux server, so notifications work without opening the picker first.
# `daemon start` exits 1 without side effects when the daemon is already running.
run-shell -b 'ccmux daemon start --background --socket "#{socket_path}" >/dev/null 2>&1 || true'

## Plugins
set -g @plugin 'tmux-plugins/tpm'             # Plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'   # Sensible TMUX bindings, see: https://github.com/tmux-plugins/tmux-sensible
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Save (<C-b> s) and restore (<C-b> r) TMUX sessions
set -g @plugin 'laktak/extrakto'              # Extract parts of TMUX buffer (including SSH sessions)
set -g @plugin 'roosta/tmux-fuzzback'         # Search TMUX buffer with FZF (<C-b> <C-f>)
set -g @plugin '2kabhishek/tmux2k'            # A minimal and clean tmux theme

set -g @tmux2k-theme 'onedark'

set -g @tmux2k-left-plugins "session git"
set -g @tmux2k-right-plugins "bandwidth cpu ram"

# No Nerd Font (PROVEASIO_NERD_FONTS=0, see ~/.zshrc; read when the tmux server starts):
# no Powerline separators, text icons. tmux2k uses its glyph for an empty option, and
# a single space gives an empty icon. Its bandwidth plugin reads the up icon for both
# directions, hence one neutral label. Its git plugin always prints a Nerd Font branch
# icon, so the git segment is left out (the p10k prompt shows the branch).
if-shell '[ "$PROVEASIO_NERD_FONTS" = 0 ]' {
  set -g @tmux2k-left-plugins "session"
  set -g @tmux2k-show-powerline false
  set -g @tmux2k-session-icon ' '
  set -g @tmux2k-bandwidth-up-icon 'net'
  set -g @tmux2k-cpu-icon 'CPU'
  set -g @tmux2k-ram-icon 'RAM'
}

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Agent state in the window list (after tpm, which sets tmux2k's window-status-format).
# A window that is not selected turns yellow when an agent in it waits for input and
# green when it finished; selecting the window clears it. ccmux sets @agent_state
# through ~/.local/bin/tmux-agent-status (notifications.command in ~/.config/ccmux/ccmux.json).
# @agent-status-bg/-fg are tmux2k onedark's colours for windows that are not selected.
set -g @agent-status-bg '#4f4f4f'
set -g @agent-status-fg '#f8f8f8'
set -g @agent-status-bg-format '#{?#{==:#{@agent_state},waiting},#e5c07b,#{?#{==:#{@agent_state},finished},#98c379,#{@agent-status-bg}}}'
set -g @agent-status-fg-format '#{?#{@agent_state},#2d3139,#{@agent-status-fg}}'
set-hook -g session-window-changed 'set -wu @agent_state'
set-hook -g client-session-changed 'set -wu @agent_state'
run '~/.local/bin/tmux-agent-status format'

---
- name: "[Config][Tmux] Install session-naming helper script"
  ansible.builtin.copy:
    src: tmux-default-session-name.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/tmux-default-session-name"
    mode: "0755"

- name: "[Config][Tmux] Configure .tmux.conf"
  vars:
    app: Tmux
    source_file: tmux.conf
    target_file: "{{ ansible_facts['env']['HOME'] }}/.tmux.conf"
  ansible.builtin.include_role:
    name: common
    tasks_from: config_file.yml

- name: "[Config][Tmux] Install plugins"
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm/bin/install_plugins"
  register: tpm_install
  changed_when: "'Installing' in tpm_install.stdout"

# Plugins are updated on every run by design (always keep plugins current).
- name: "[Config][Tmux] Update plugins"
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm/bin/update_plugins all"
  register: tpm_update
  changed_when: "'update success' in tpm_update.stdout"

- name: "[Config][Tmuxp] Create directory in {{ ansible_facts['env']['HOME'] }}/.tmuxp"
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.tmuxp"
    state: directory
    mode: '0755'

- name: "[Config][Tmuxp] Check for existing files in {{ ansible_facts['env']['HOME'] }}/.tmuxp"
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.tmuxp"
    file_type: file
    recurse: no
    hidden: true
  register: tmuxp_existing_files
  changed_when: false

- name: "[Config][Tmuxp] Add default session file"
  vars:
    app: Tmuxp
    source_file: tmuxp-default.yaml
    target_file: "{{ ansible_facts['env']['HOME'] }}/.tmuxp/default_session.yaml"
  ansible.builtin.include_role:
    name: common
    tasks_from: config_file.yml
  when: tmuxp_existing_files.matched | default(0) == 0

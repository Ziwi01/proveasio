# Install neovim custom config
---
- name: "[Neovim config] Validate config source"
  ansible.builtin.assert:
    that:
      - neovim_config_source in ['git', 'local']
      - neovim_config_source == 'git' or neovim_config_local_path | length > 0
      - neovim_config_source == 'git' or neovim_config_local_path | expanduser is abs
    fail_msg: >-
      neovim_config_source must be 'git' or 'local', and 'local' needs
      neovim_config_local_path set to an absolute path or one starting with ~
      (got source '{{ neovim_config_source }}', path '{{ neovim_config_local_path }}')
    quiet: true

- name: "[Neovim config] Clone/update config version {{ neovim_config_version }}"
  ansible.builtin.git:
    repo: "{{ neovim_config_url }}"
    dest: "{{ neovim_config_path }}"
    update: true
    version: "{{ neovim_config_version }}"
  when: neovim_config_source == 'git'

- name: "[Neovim config] Copy local config from {{ neovim_config_local_path }}"
  ansible.builtin.copy:
    src: "{{ neovim_config_local_path }}/"
    dest: "{{ neovim_config_path }}/"
    mode: preserve
  when: neovim_config_source == 'local'

# Checked before the first headless start, which creates both.
- name: "[Neovim config] Check for installed plugins"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/{{ neovim_config_appname }}/lazy"
  register: neovim_config_plugins

- name: "[Neovim config] Check for a lockfile"
  ansible.builtin.stat:
    path: "{{ neovim_config_path }}/lazy-lock.json"
  register: neovim_config_lockfile

# Runs on every play by design: the headless launch drives lazy.nvim/Mason
# plugin + LSP sync. There is no reliable "already up to date" signal to gate
# on, so this is an accepted always-run task (changed_when:false keeps it from
# reporting a spurious change on every run).
- name: "[Neovim config] Update Neovim config"
  ansible.builtin.command: "nvim --headless +q"
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin/:{{ ansible_facts['env']['PATH'] }}"
    NVIM_APPNAME: "{{ neovim_config_appname }}"

# On the first start the plugins that the config imports (AstroNvim) are not
# installed yet, so their specs are missing while lazy.nvim installs the rest.
# A plugin that only they give a `version` for is installed from its default
# branch (blink.cmp: v2 from `main` instead of `^1`), and lazy.nvim does not
# check it out again on later starts. One update with the full spec fixes the
# checkouts. Skipped when the config ships a lockfile, which the first start
# already follows.
- name: "[Neovim config] Update plugins after the first install"
  ansible.builtin.command: nvim --headless "+Lazy! update" +qa
  changed_when: true
  failed_when: false
  when:
    - not neovim_config_plugins.stat.exists
    - not neovim_config_lockfile.stat.exists
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin/:{{ ansible_facts['env']['PATH'] }}"
    NVIM_APPNAME: "{{ neovim_config_appname }}"

- name: "[Neovim config] Save used version"
  vars:
    app: neovim-config
    neovim_config_saved_version: "{{ neovim_config_version if neovim_config_source == 'git' else 'local' }}"
    target_version:
      neovim_config_version: "{{ neovim_config_saved_version }}"
    yq_query: '.neovim_config_version = "{{ neovim_config_saved_version }}"'
  ansible.builtin.include_role:
    name: common
    tasks_from: save_version.yml
    apply:
      tags:
        - versions
  tags:
    - versions

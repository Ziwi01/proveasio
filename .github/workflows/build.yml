name: "Build"

on:
  push:
    branches:
      - "master"
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

jobs:
  ubuntu-24:
    name: "Build (Ubuntu 24)"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Fix grub-efi-amd64 error
        run: |
          sudo apt remove shim-signed grub-efi-amd64-bin -y --allow-remove-essential

      - name: Prepare for setup
        run: sudo sh prepare-ubuntu.sh

      - name: Build Proveasio'ned environment
        working-directory: ./ansible
        run: ansible-playbook -i inventory.yml setup-ubuntu.yml

      - name: Push latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag latest -f
          git push origin latest -f

      # Take the newest real version tag. `latest` must be filtered out: it is a
      # lightweight tag, so `--sort=creatordate` sorts it by the committer date of
      # the commit it points at, which makes its position in the list depend on
      # where it happens to be force-pushed.
      - name: Get previous tag
        id: previousTag
        run: |
          name=$(git --no-pager tag --sort=creatordate --merged "${{ github.ref_name }}" | grep -v '^latest$' | tail -1)
          echo "previousTag: $name"
          echo "previousTag=$name" >> "$GITHUB_ENV"

      # requarks/changelog-action refuses to write when the topmost section of the
      # CHANGELOG already matches the tag it is about to add ("This version already
      # exists in the CHANGELOG!"). Since we always regenerate the rolling `latest`
      # section, drop the previous one first. Released `## [vX.Y.Z]` sections are
      # preserved.
      - name: Drop the previous `latest` section from CHANGELOG.md
        run: |
          set -euo pipefail
          [ -f CHANGELOG.md ] || exit 0
          awk '
            /^## \[latest\]/ { skip = 1; next }
            skip && /^## \[/ { skip = 0 }
            skip             { next }
            /^\[latest\]: /  { next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      # NOTE: the action's input names are inverted with respect to their meaning:
      # it compares `toTag...fromTag`, i.e. `fromTag` is the HEAD and `toTag` is the
      # BASE. `fromTag` is also what ends up as the `## [<tag>]` heading.
      - name: Generate CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: latest
          toTag: ${{ env.previousTag }}

      - name: Create Pre-Release
        uses: ncipollo/release-action@v1.12.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          tag: latest
          prerelease: true
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

      # Mirror the CHANGELOG into the Docusaurus docs. The MDX loader is scoped to
      # the docs plugin's content dir, so the file has to physically live there;
      # `format: md` forces CommonMark parsing so that stray `<...>` or `{...}` in a
      # commit subject cannot break the docs build.
      - name: Render CHANGELOG as a docs page
        if: steps.changelog.outputs.changes != ''
        run: |
          set -euo pipefail
          {
            echo '---'
            echo 'sidebar_position: 9'
            echo 'title: Changelog'
            echo 'format: md'
            echo '---'
            echo
            tail -n +2 CHANGELOG.md
          } > docs-web/docs/main/changelog.md

      # Committed to `develop`, not `master`: `pages.yml` only deploys the docs site
      # on push to `develop`.
      - name: Commit CHANGELOG to develop
        id: commitChangelog
        if: steps.changelog.outputs.changes != ''
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"

          tmp="$(mktemp -d)"
          cp CHANGELOG.md "$tmp/CHANGELOG.md"
          cp docs-web/docs/main/changelog.md "$tmp/changelog.md"

          git fetch origin develop
          git checkout -f -B develop origin/develop

          cp "$tmp/CHANGELOG.md" CHANGELOG.md
          cp "$tmp/changelog.md" docs-web/docs/main/changelog.md

          git add CHANGELOG.md docs-web/docs/main/changelog.md
          if git diff --staged --quiet; then
            echo "CHANGELOG unchanged, nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: Update CHANGELOG for ${{ github.ref_name }}"
          git push origin develop
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the docs
      # deployment has to be dispatched explicitly. `workflow_dispatch` is one of the
      # two events GitHub exempts from that restriction.
      - name: Deploy the documentation
        if: steps.commitChangelog.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref develop

name: "Build"

on:
  push:
    branches:
      - "master"
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

# Every trigger builds master: the checkout below always takes `master`.
# Scheduled runs start on the default branch (develop), so github.ref_name is
# `develop` there. The pre-release is named after BUILD_BRANCH instead, or the
# weekly run would name it "develop".
env:
  BUILD_BRANCH: master

jobs:
  ubuntu-26:
    name: "Build (Ubuntu 26)"
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0

      - name: Prepare for setup
        run: sudo sh prepare-ubuntu.sh

      # Without a token, the version lookups share the unauthenticated GitHub API
      # limit (60/hour per runner IP) and fail at random. GH_TOKEN is a
      # repository secret holding a read-only PAT; github.token is the fallback.
      - name: Build Proveasio'ned environment
        working-directory: ./ansible
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: ansible-playbook -i inventory.yml setup-ubuntu.yml

      - name: Push latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag latest -f
          git push origin latest -f

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      # Commits on master since the newest v* tag. When there are none (the
      # weekly run right after a release), say so instead of failing.
      - name: Generate pre-release notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          count=$(git cliff --config cliff.toml --unreleased --context | jq '[.[].commits[]] | length')
          if [ "$count" -eq 0 ]; then
            echo "No changes since $(git describe --tags --abbrev=0 --match 'v[0-9]*')." > "$notes"
          else
            git cliff --config cliff.toml --unreleased --strip all > "$notes"
          fi
          cat "$notes"

      - name: Create Pre-Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          tag: latest
          prerelease: true
          name: ${{ env.BUILD_BRANCH }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          token: ${{ github.token }}

      # CHANGELOG.md is generated from develop, so "Unreleased" lists everything
      # not yet in a v* tag. Committed to develop only when it changed. The docs
      # page is generated at docs build time (pages.yml), so no deploy is needed.
      - name: Commit CHANGELOG to develop
        run: |
          set -euo pipefail
          # Retried from a fresh origin/develop when a push lands in between.
          for attempt in 1 2 3; do
            git fetch origin develop
            git checkout -f -B develop origin/develop
            git cliff --config cliff.toml --output CHANGELOG.md
            if git diff --quiet -- CHANGELOG.md; then
              echo "CHANGELOG unchanged, nothing to commit."
              exit 0
            fi
            git add CHANGELOG.md
            git commit -m "docs: Update CHANGELOG"
            if git push origin develop; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying from origin/develop."
          done
          exit 1
